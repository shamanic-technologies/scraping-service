name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI spec
        run: npm run generate:openapi

      - name: Run unit tests
        run: npm run test:unit
        env:
          SCRAPING_SERVICE_API_KEY: test-api-key
          SCRAPING_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/test
          KEY_SERVICE_URL: https://key.test.org
          KEY_SERVICE_API_KEY: test-key-service-key

      - name: Build
        run: npm run build
        env:
          SCRAPING_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/test

  test-integration:
    runs-on: ubuntu-latest

    # Throwaway Postgres per run. The Neon project the PR branches were cut from
    # (vars.NEON_PROJECT_ID) was deleted, so every PR failed this required check
    # at "Create Neon branch" with a 404 before a single test ran.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SCRAPING_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Push schema
        run: npx drizzle-kit push --force

      - name: Run integration tests
        run: npm run test:integration
        env:
          SCRAPING_SERVICE_API_KEY: test-api-key
          KEY_SERVICE_URL: https://key.test.org
          KEY_SERVICE_API_KEY: test-key-service-key
